<!-- Google Analytics 4 — put the client's measurement ID in GA_ID below and
     nothing else needs changing. It loads only after the visitor accepts the
     cookie bar, which is what the privacy page promises; an empty ID loads
     nothing at all, which is how the demo ships. Runs from <head> so the
     stored choice is honoured before the page paints. -->
<script>
(function (w) {
  w.GA_ID = '';
  function load() {
    if (!w.GA_ID || w.gaLoaded) return;
    w.gaLoaded = true;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=' + w.GA_ID;
    document.head.appendChild(s);
    w.dataLayer = w.dataLayer || [];
    w.gtag = function () { w.dataLayer.push(arguments); };
    w.gtag('js', new Date());
    w.gtag('config', w.GA_ID);
  }
  w.setConsent = function (v) {
    try { localStorage.setItem('cookie', v); } catch (e) {}
    if (v === 'yes') load();
  };
  var saved = '';
  try { saved = localStorage.getItem('cookie') || ''; } catch (e) {}
  w.cookieChoice = saved;
  if (saved === 'yes') load();
})(window);
</script>

<!-- Contact form delivery. A static site has nowhere to POST to, so the form
     goes to our Cloudflare Worker (form-worker/ in the repo), which pushes the
     enquiry into the client's inbox. Put that Worker's URL in FORM_ENDPOINT;
     leave it empty and the form only pretends to send, which is how a demo
     must behave. -->
<script>
(function (w) {
  w.FORM_ENDPOINT = 'https://wlc-form.thanakorn10.workers.dev/';
  var opened = Date.now();
  // A promise for "did it get through" — never rejects, so the page always
  // has something to say. A form that hangs on a network error is worse than
  // one that says "call us instead".
  // A form carrying a file (the CV on the careers page) goes as multipart,
  // the file untouched; everything else stays the small JSON post it was.
  w.wlcSend = function (form) {
    if (!w.FORM_ENDPOINT) return Promise.resolve(true);
    var fd = new FormData(form);
    var meta = { page: location.pathname, elapsed: String(Date.now() - opened) };
    var file = form.querySelector('input[type=file]');
    var init = { method: 'POST' };
    if (file && file.files.length) {
      for (var k in meta) fd.append(k, meta[k]);
      init.body = fd;
    } else {
      var data = meta;
      fd.forEach(function (v, k) { if (typeof v === 'string') data[k] = v; });
      init.headers = { 'content-type': 'application/json' };
      init.body = JSON.stringify(data);
    }
    return fetch(w.FORM_ENDPOINT, init)
      .then(function (r) { return r.ok; }).catch(function () { return false; });
  };
})(window);
</script>

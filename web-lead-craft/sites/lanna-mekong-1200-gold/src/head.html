<!-- Registration delivery. A static site has nowhere to POST to, so the form
     goes to our Cloudflare Worker (form-worker/ in the repo), which emails the
     registration and the payment slip to the organiser. It stores nothing.
     Empty FORM_ENDPOINT = demo mode: the form only pretends to send.
     The Worker's SITES secret needs an entry for this site's exact origin
     (scheme + host) with forms.register — see docs/handover-lanna-gold.md. -->
<script>
(function (w) {
  w.FORM_ENDPOINT = 'https://wlc-form.thanakorn10.workers.dev/';
  var opened = Date.now();
  // Resolves to { ok, error } and never rejects, so the page always has
  // something true to say. Multipart, because a registration carries a slip.
  w.wlcSend = function (fd) {
    fd.append('page', location.pathname);
    fd.append('elapsed', String(Date.now() - opened));
    if (!w.FORM_ENDPOINT) return Promise.resolve({ ok: true });
    return fetch(w.FORM_ENDPOINT, { method: 'POST', body: fd })
      .then(function (r) {
        return r.json().catch(function () { return {}; })
          .then(function (j) { return { ok: r.ok && j.ok !== false, error: j.error || '' }; });
      })
      .catch(function () { return { ok: false, error: 'network' }; });
  };
})(window);
</script>

<!-- Contact form delivery. A static site has nowhere to POST to, so the form
     goes to our Cloudflare Worker (form-worker/ in the repo), which delivers
     the entry to the organiser by email, LINE, or both. Put that Worker's URL
     in FORM_ENDPOINT; leave it empty and the form only pretends to send,
     which is how a demo must behave. -->
<script>
(function (w) {
  w.FORM_ENDPOINT = '';
  var opened = Date.now();
  // A promise for "did it get through" — never rejects, so the page always
  // has something to say.
  w.wlcSend = function (form) {
    var data = { page: location.pathname, elapsed: Date.now() - opened };
    new FormData(form).forEach(function (v, k) { data[k] = v; });
    if (!w.FORM_ENDPOINT) return Promise.resolve(true);
    return fetch(w.FORM_ENDPOINT, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(data)
    }).then(function (r) { return r.ok; }).catch(function () { return false; });
  };
})(window);
</script>

<!-- Still deliberately NOT a schema.org/Event: the organiser gave a month
     (November 2027) but no specific day, and startDate is required for that
     type. Guessing a day to satisfy the schema would be the one lie this was
     built to avoid — so the real facts we do have (distance, time limit,
     price) go on Organization instead, and Event waits for an actual date. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
